seed: 42


models:
  separate: True

  policy:
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -2.0
    max_log_std: 0.5
    initial_log_std: -0.2

    network:
      # - name: image_branch
      #   input: OBSERVATIONS["rgb"]
      #   layers:
      #     - conv2d: {out_channels: 32, kernel_size: 8, stride: 4, padding: 0}
      #     - conv2d: {out_channels: 64, kernel_size: 4, stride: 2, padding: 0}
      #     - conv2d: {out_channels: 128, kernel_size: 3, stride: 1, padding: 0}
      #     - flatten
      #     - linear: 512
      #     - linear: 256
      #   activations: [relu, relu, relu, null, relu, relu]

      - name: vector_branch
        input: concatenate([OBSERVATIONS["pose_command"], OBSERVATIONS["base_lin_vel"]])
        layers: [32, 64]
        activations: relu

      # - name: fusion_trunk
      #   input: concatenate([image_branch, vector_branch])
      #   layers: [256, 128]
      #   activations: elu
    output: ACTIONS

  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: image_branch
        input: OBSERVATIONS["rgb"]
        layers:
          - conv2d: {out_channels: 32, kernel_size: 8, stride: 4, padding: 0}
          - conv2d: {out_channels: 64, kernel_size: 4, stride: 2, padding: 0}
          - conv2d: {out_channels: 128, kernel_size: 3, stride: 1, padding: 0}
          - flatten
          - linear: 512
          - linear: 256
        activations: [relu, relu, relu, null, relu, relu]

      - name: vector_branch
        input: concatenate([OBSERVATIONS["pose_command"], OBSERVATIONS["base_lin_vel"]])
        layers: [32, 64]
        activations: relu

      - name: fusion_trunk
        input: concatenate([image_branch, vector_branch])
        layers: [256, 128]
        activations: elu
    output: ONE



# Rollout memory
# https://skrl.readthedocs.io/en/latest/api/memories/random.html
memory:
  class: RandomMemory
  memory_size: -1  # automatically determined (same as agent:rollouts)


# PPO agent configuration (field names are from PPO_DEFAULT_CONFIG)
# https://skrl.readthedocs.io/en/latest/api/agents/ppo.html
agent:
  class: PPO
  rollouts: 16
  learning_epochs: 10
  mini_batches: 4  # Increased for better learning with multiple environments
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 3.0e-04
  learning_rate_scheduler: null
  learning_rate_scheduler_kwargs: {}
  state_preprocessor: null
  state_preprocessor_kwargs: null
  value_preprocessor: null
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.05
  value_loss_scale: 1.0
  kl_threshold: 0.0
  rewards_shaper_scale: 1.0
  time_limit_bootstrap: False
  # logging and checkpoint
  experiment:
    directory: "ticvla_navigation"
    experiment_name: ""
    write_interval: 1
    checkpoint_interval: 30000


# Sequential trainer
# https://skrl.readthedocs.io/en/latest/api/trainers/sequential.html
trainer:
  class: SequentialTrainer
  timesteps: 200000
  environment_info: log
  # Save best checkpoint based on evaluation performance
  save_best_agent: True
  save_best_agent_interval: 1000  # Check for best agent every 1000 timesteps
  save_best_agent_metric: "eval/mean_reward"  # Metric to track for best agent
  save_best_agent_mode: "max"  # "max" for reward (higher is better), "min" for loss
